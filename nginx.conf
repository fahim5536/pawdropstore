worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # WAF and Security Hardening Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;";

    # Gzip settings for performance bridging
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Caching strategy for Edge Computing simulation
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=legacy_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream legacy_java_backend {
        server java_backend:8080;
        # Add additional nodes here for load balancing
    }

    upstream legacy_php_backend {
        server php_backend:9000;
        # Add additional nodes here for load balancing
    }

    upstream modern_frontend {
        # Express/React frontend server
        server localhost:3000;
    }

    server {
        listen 80;
        server_name _;

        # Modern Frontend (React Micro-frontend container)
        location / {
            proxy_pass http://modern_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Inject Priority Hints for modern performance
            add_header Link "<https://fonts.googleapis.com>; rel=preconnect";
        }

        # Legacy Java/Spring Backend Route (API Gateway)
        location /api/java/ {
            proxy_pass http://legacy_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Caching to bridge performance gap
            proxy_cache legacy_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            add_header X-Proxy-Cache $upstream_cache_status;
        }

        # Legacy PHP Modules Route
        location /api/php/ {
            proxy_pass http://legacy_php_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Bypass cache for dynamic PHP content if needed
            proxy_cache_bypass $http_cache_control;
        }
    }
}
